name: Release (approved)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Reviewed, CI-passing main commit SHA (40 lowercase hex characters)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-toolkit-manual-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale commits and missing checks
        env:
          TARGET_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid candidate SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" || { echo "SHA does not match current main" >&2; exit 1; }
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100")"
          for name in "validate" "Enterprise install (windows-latest)" "Enterprise install (macos-latest)" \
            "analyze (javascript-typescript)" "analyze (python)"; do
            jq -e --arg sha "$TARGET_SHA" --arg name "$name" \
              'any(.check_runs[]; .name == $name and .head_sha == $sha and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success")' \
              <<< "$checks" >/dev/null || { echo "Missing successful exact-revision check: $name" >&2; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Validate, package, and prepare release evidence
        env:
          TARGET_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_skill_pack.py . --as-of "$(date -u +%Y-%m-%d)"
          python scripts/verify_anti_slop_vendor.py .
          python scripts/verify_release_metadata.py .
          node --test scripts/test_evaluate_behavioral_runs.mjs scripts/test_enterprise_approval.mjs scripts/test_destructive_safety.mjs
          git diff --exit-code -- .github/assets package.json CHANGELOG.md scripts bin skills orchestration
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          mkdir -p release-bundle
          python - "$version" "release-bundle/release-notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path
          version, output = sys.argv[1], Path(sys.argv[2])
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## {re.escape(version)} - [^\n]+\n\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text)
          if match is None or not match.group(1).strip():
              raise SystemExit(f"missing/non-empty CHANGELOG section for {version}")
          output.write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
          archive="$(npm pack --silent)"
          mv "$archive" release-bundle/
          (cd release-bundle && sha256sum "$archive" > SHA256SUMS)
          printf '%s\n' "$TARGET_SHA" > release-bundle/candidate-sha
          printf '%s\n' "$archive" > release-bundle/archive-name
          printf '%s\n' "$tag" > release-bundle/tag

      - name: Upload candidate package for approved promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vetted-release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-approval
    permissions:
      contents: write
    steps:
      - name: Check out current main without running project scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download vetted package from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vetted-release-bundle
          path: release-bundle

      - name: Publish approved immutable release
        env:
          TARGET_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-bundle
          recorded="$(cat candidate-sha)"
          archive="$(cat archive-name)"
          tag="$(cat tag)"
          test "$recorded" = "$TARGET_SHA" || { echo "Candidate identity changed" >&2; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          test "$archive" = "cmdr-chara-codex-toolkit-${tag#v}.tgz" || { echo "Archive does not match release" >&2; exit 1; }
          sha256sum --check SHA256SUMS
          cd ..
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" || { echo "Checked-out main advanced" >&2; exit 1; }
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA" || { echo "Main advanced; aborting" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists; cannot overwrite immutable release identity" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Codex Toolkit $tag" "$TARGET_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "Codex Toolkit $tag" \
            --notes-file "release-bundle/release-notes.md" \
            "release-bundle/$archive" "release-bundle/SHA256SUMS"
