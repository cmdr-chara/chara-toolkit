name: Release (approved)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Reviewed, CI-passing main commit SHA (40 lowercase hex characters)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-toolkit-manual-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-approval
    permissions:
      contents: write
      checks: read
    steps:
      - name: Check out approved main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify exact main SHA and completed CI
        env:
          TARGET_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid candidate SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" || { echo "Selected SHA does not match current main" >&2; exit 1; }
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100")"
          for name in "validate" "Enterprise install (windows-latest)" "Enterprise install (macos-latest)" \
            "analyze (javascript-typescript)" "analyze (python)"; do
            jq -e --arg sha "$TARGET_SHA" --arg name "$name" \
              'any(.check_runs[]; .name == $name and .head_sha == $sha and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success")' \
              <<< "$checks" >/dev/null || { echo "Missing successful exact-revision check: $name" >&2; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Verify release candidate
        run: |
          set -euo pipefail
          python scripts/validate_skill_pack.py . --as-of "$(date -u +%Y-%m-%d)"
          python scripts/verify_anti_slop_vendor.py .
          python scripts/verify_release_metadata.py .
          node --test scripts/test_evaluate_behavioral_runs.mjs scripts/test_enterprise_approval.mjs
          npm pack --dry-run >/dev/null
          git diff --exit-code -- .github/assets package.json CHANGELOG.md scripts bin skills orchestration

      - name: Build immutable source package and release notes
        env:
          TARGET_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA" || { echo "Main advanced; aborting release" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; never overwrite release identities" >&2
            exit 1
          fi
          python - "$version" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path
          version, output = sys.argv[1], Path(sys.argv[2])
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## {re.escape(version)} - [^\n]+\n\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text)
          if match is None or not match.group(1).strip():
              raise SystemExit(f"missing/non-empty CHANGELOG section required for {version}")
          output.write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
          archive="$(npm pack --silent)"
          sha256sum "$archive" > SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA" || { echo "Main moved during release; aborting" >&2; exit 1; }
          git tag -a "$tag" -m "Codex Toolkit $tag" "$TARGET_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "Codex Toolkit $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "$archive" "SHA256SUMS"
